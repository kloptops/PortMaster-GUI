name: GUI Release

on:
  # We only run manually
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: alpha

concurrency:
  group: release # only 1 release at a time

jobs:
  # Build the same Ubuntu 24.04 container locally or in CI. Native runners
  # keep architecture-specific outputs reproducible without emulation.
  build-retrodeck-tools:
    name: RetroDECK tools (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            elf_machine: Advanced Micro Devices X86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build architecture-specific tools in Ubuntu 24.04
        run: |
          mkdir -p "retrodeck-tools/${{ matrix.arch }}"
          docker buildx build \
            --platform "linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}" \
            --build-arg RETRODECK_ARCH="${{ matrix.arch }}" \
            --file Dockerfile.retrodeck-tools \
            --target artifact \
            --output "type=local,dest=retrodeck-tools/${{ matrix.arch }}" .

      - name: Preserve tool symlinks in artifact archive
        run: tar -C "retrodeck-tools/${{ matrix.arch }}" -czf "retrodeck-tools-${{ matrix.arch }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: retrodeck-tools-${{ matrix.arch }}
          path: retrodeck-tools-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-armhf-experiment:
    name: Experimental ARMHF runtime and Mesa bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ARMHF SDL runtime
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file experimental/armhf-runtime/Dockerfile \
            --target artifact \
            --output type=local,dest=armhf-output .

      - name: Build ARMHF Mesa graphics sidecar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file experimental/armhf-runtime/Dockerfile.graphics \
            --target artifact \
            --output type=local,dest=mesa-output .

      - name: Stage and archive experimental bundle
        run: |
          mkdir -p armhf-bundle
          cp -a armhf-output/armhf-runtime armhf-bundle/
          cp -a mesa-output/armhf-mesa armhf-bundle/mesa.armhf
          tar -C armhf-bundle -czf armhf-bundle.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: retrodeck-armhf-experimental
          path: armhf-bundle.tar.gz
          if-no-files-found: error

  build:
    needs: [build-retrodeck-tools, build-armhf-experiment]
    runs-on: ubuntu-latest

    steps:
      - name: Clean out files part 1
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - name: Download RetroDECK tools
        uses: actions/download-artifact@v4
        with:
          pattern: retrodeck-tools-*
          path: retrodeck-tools
          merge-multiple: false

      - name: Download experimental ARMHF bundle
        uses: actions/download-artifact@v4
        with:
          name: retrodeck-armhf-experimental
          path: armhf-bundle

      - name: Extract build artifacts
        run: |
          for arch in x86_64 aarch64; do
            tar -C "retrodeck-tools/retrodeck-tools-$arch" -xzf \
              "$GITHUB_WORKSPACE/retrodeck-tools/retrodeck-tools-$arch/retrodeck-tools-$arch.tar.gz"
          done
          tar -C armhf-bundle -xzf "$GITHUB_WORKSPACE/armhf-bundle/armhf-bundle.tar.gz"

      - name: Install architecture-specific tools
        run: |
          for arch in x86_64 aarch64; do
            mkdir -p "PortMaster/retrodeck/$arch"
            cp -a "retrodeck-tools/retrodeck-tools-$arch/." "PortMaster/retrodeck/$arch/"
            chmod 755 "PortMaster/retrodeck/$arch/unsquashfs" "PortMaster/retrodeck/$arch/liblzo2.so.2"
          done

      - name: Stage experimental ARMHF bundle for RetroDECK ZIP
        run: |
          mkdir -p PortMaster/retrodeck
          cp -a armhf-bundle/armhf-runtime PortMaster/retrodeck/
          cp -a armhf-bundle/mesa.armhf PortMaster/retrodeck/

      - name: Clean out files part 2
        run: |
          rm -rf .git
          echo "Free Space"
          df -h

      - name: env - better defaulting of env vars;
        id: env
        run: |
            RELEASE_REPO="${{ secrets.RELEASE_REPO }}"
            if [[ -z "$RELEASE_REPO" ]]; then
              RELEASE_REPO="PortMaster-GUI"
            fi
            echo "RELEASE_REPO=$RELEASE_REPO" >> $GITHUB_OUTPUT

            RELEASE_ORG="${{ secrets.RELEASE_ORG }}"
            if [[ -z "$RELEASE_ORG" ]]; then
              RELEASE_ORG="PortsMaster"
            fi
            echo "RELEASE_ORG=$RELEASE_ORG" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - uses: edgarrc/action-7z@v1

      # The current version.json, do_release.sh updates this channel's entry in it.
      - uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "*.json"

      # Only stable builds installers, the others carry the latest ones along.
      - uses: robinraju/release-downloader@v1.8
        if: ${{ inputs.channel != 'stable' }}
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "Install*PortMaster.sh"
          out-file-path: dist

      - name: Get release name for artifacts
        id: version
        run: |
            echo "version=$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
            echo "release=${{ inputs.channel }}" >> $GITHUB_OUTPUT

      - name: Create PortMaster.zip
        id: create-zip
        run: |
          ./do_release.sh "${{steps.version.outputs.release}}" "${{steps.version.outputs.version}}"

          # The CFW bundles are what CFWs put in their images: always made from stable.
          if [[ "${{steps.version.outputs.release}}" == "stable" ]]; then
            BUNDLE_FROM=""
          else
            BUNDLE_FROM="stable"
          fi

          ./do_muos_release.sh $BUNDLE_FROM
          ./do_trimui_release.sh $BUNDLE_FROM
          RD_INCLUDE_ARMHF_EXPERIMENTAL=1 ./do_retrodeck_release.sh $BUNDLE_FROM

      - name: Create md5 hashes
        id: md5
        run: |
            cd dist
            for file in *.zip; do
              if [ ! -f "$file" ]; then
                continue
              fi
              echo "file: $file"
              md5sum "$file" | cut -f1 -d' ' > "$file.md5"
            done

      - name: "Prepare Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{steps.version.outputs.version}}"
          allowUpdates: true
          draft: true
          prerelease: false
          replacesArtifacts: false
          omitNameDuringUpdate: true
          body: "Release: ${{steps.version.outputs.version}} (${{steps.version.outputs.release}})"
          artifacts: "dist/PortMaster.zip, dist/PortMaster.zip.md5, dist/version, dist/version.json, dist/Install*PortMaster.sh, dist/muos.portmaster.zip, dist/muos.portmaster.zip.md5, dist/retrodeck.portmaster.zip, dist/retrodeck.portmaster.zip.md5, dist/trimui.portmaster.zip, dist/trimui.portmaster.zip.md5"
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ steps.env.outputs.RELEASE_REPO }}
          owner: ${{ steps.env.outputs.RELEASE_ORG }}

      - name: "Publish Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{steps.version.outputs.version}}"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ steps.env.outputs.RELEASE_REPO}}
          owner: ${{ steps.env.outputs.RELEASE_ORG}}

      - name: Release Info
        id: info
        run: |
          echo "Published release: ${{steps.version.outputs.version}} (${{steps.version.outputs.release}}) to: https://github.com/${{ steps.env.outputs.RELEASE_ORG}}/${{ steps.env.outputs.RELEASE_REPO}}"
