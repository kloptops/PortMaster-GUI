name: GUI Release

on:
  # We only run manually
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: alpha

concurrency:
  group: release # only 1 release at a time

jobs:
  # Build against Ubuntu 24.04 (glibc 2.39) to keep the dynamic LZO library
  # compatible with RetroDECK's KDE Flatpak runtime (glibc 2.42). unsquashfs
  # is linked statically; liblzo2.so.2 remains bundled for other consumers.
  # Build from Ubuntu Noble's patched squashfs-tools source, pinned to 4.6.1-1build1.
  build-retrodeck-tools:
    name: RetroDECK tools (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            elf_machine: Advanced Micro Devices X86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install Ubuntu 24.04 packages
        run: |
          if ! grep -q '^Types: .*deb-src' /etc/apt/sources.list.d/ubuntu.sources; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential cmake dpkg-dev liblzo2-2 liblzo2-dev \
            liblz4-dev liblzma-dev libzstd-dev libgles1 zlib1g-dev

      - name: Build static unsquashfs and stage LZO library
        run: |
          mkdir -p "retrodeck-tools/${{ matrix.arch }}"
          squashfs_tools_version='1:4.6.1-1build1'
          cd "$RUNNER_TEMP"
          apt-get source "squashfs-tools=$squashfs_tools_version"
          cd "$GITHUB_WORKSPACE"
          make -C "$RUNNER_TEMP/squashfs-tools-4.6.1/squashfs-tools" unsquashfs \
            GZIP_SUPPORT=1 LZO_SUPPORT=1 LZ4_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1 \
            LDFLAGS=-static
          cp "$RUNNER_TEMP/squashfs-tools-4.6.1/squashfs-tools/unsquashfs" "retrodeck-tools/${{ matrix.arch }}/unsquashfs"
          lzo_library="$(ldconfig -p | awk '/liblzo2\.so\.2 / { print $NF; exit }')"
          test -n "$lzo_library"
          cp -L "$lzo_library" "retrodeck-tools/${{ matrix.arch }}/liblzo2.so.2"
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            # Neverball's AArch64 port needs the GLVND GLES 1 dispatch library.
            cp -L /usr/lib/aarch64-linux-gnu/libGLESv1_CM.so.1.2.0 \
              retrodeck-tools/aarch64/libGLESv1_CM.so.1.2.0
            cp /usr/share/doc/libgles1/copyright \
              retrodeck-tools/aarch64/libgles1-copyright
            readelf -h retrodeck-tools/aarch64/libGLESv1_CM.so.1.2.0 |
              grep -F 'Machine:' | grep -F 'AArch64'
            readelf -d retrodeck-tools/aarch64/libGLESv1_CM.so.1.2.0 |
              grep -F 'libGLdispatch.so.0'

            # Build the GLES 1.1 compatibility implementation and EGL shim
            # used by ports whose GLES 1 calls must run through GL4ES.
            gl4es_commit='bcdacab3369347da3a0515b15ff050a329f9eb3b'
            git clone https://github.com/sookyboo/4gles1.git \
              "$RUNNER_TEMP/gl4es"
            git -C "$RUNNER_TEMP/gl4es" checkout --detach "$gl4es_commit"
            cmake -S "$RUNNER_TEMP/gl4es" -B "$RUNNER_TEMP/gl4es-build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DNOX11=ON \
              -DGLES1_WRAPPER=ON \
              -DDEFAULT_ES=2
            cmake --build "$RUNNER_TEMP/gl4es-build" --parallel "$(nproc)" \
              --target GLESv1_CM GLES1_EGL
            # gl4es writes its libraries into its source tree, not the build directory.
            gles1_dir="$RUNNER_TEMP/gl4es/lib/gles1"
            install -d retrodeck-tools/aarch64/gles1
            cp -a "$gles1_dir/libGLESv1_CM.so"* \
              "$gles1_dir/libEGL.so"* retrodeck-tools/aarch64/gles1/
            for library in \
              retrodeck-tools/aarch64/gles1/libGLESv1_CM.so.1 \
              retrodeck-tools/aarch64/gles1/libEGL.so.1; do
              readelf -h "$library" | grep -F 'Machine:' | grep -F 'AArch64'
              readelf -V "$library" | grep -E 'GLIBC_2\.(3[0-8]|[0-9])' >/dev/null || true
              if readelf --version-info "$library" | grep -Eo 'GLIBC_[0-9.]+' |
                  sort -Vu | tail -n 1 | grep -qvE 'GLIBC_2\.(0|[0-9]|[1-2][0-9]|3[0-8])$'; then
                echo "$library requires glibc newer than Ubuntu 24.04 (2.39)" >&2
                exit 1
              fi
            done
            readelf -d retrodeck-tools/aarch64/gles1/libGLESv1_CM.so.1 |
              grep -F 'SONAME' | grep -F 'libGLESv1_CM.so.1'
            readelf -d retrodeck-tools/aarch64/gles1/libEGL.so.1 |
              grep -F 'SONAME' | grep -F 'libEGL.so.1'
            readelf -d retrodeck-tools/aarch64/gles1/libEGL.so.1 |
              grep -F 'libGLESv1_CM.so.1'

            # Weston-based PortMaster ports need libjpeg v8 ABI, not the KDE
            # runtime's v6b libjpeg.so.62. Build the AArch64 shared library
            # natively on this Ubuntu 24.04 ARM64 runner.
            jpeg_version='3.2.1'
            jpeg_archive="libjpeg-turbo-${jpeg_version}.tar.gz"
            jpeg_source="$RUNNER_TEMP/libjpeg-turbo-${jpeg_version}"
            jpeg_prefix="$RUNNER_TEMP/libjpeg-turbo-install"
            curl -fL \
              "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${jpeg_version}/${jpeg_archive}" \
              -o "$RUNNER_TEMP/$jpeg_archive"
            echo 'c27ad72a68da151177929aa969ae773a2da5ac2af9ce946079314fdac8cece7f  '"$RUNNER_TEMP/$jpeg_archive" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$jpeg_archive" -C "$RUNNER_TEMP"
            cmake -S "$jpeg_source" -B "$RUNNER_TEMP/libjpeg-turbo-build" \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$jpeg_prefix" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DWITH_JPEG8=ON \
              -DWITH_TURBOJPEG=OFF \
              -DWITH_TOOLS=OFF \
              -DWITH_TESTS=OFF \
              -DENABLE_SHARED=ON \
              -DENABLE_STATIC=OFF
            cmake --build "$RUNNER_TEMP/libjpeg-turbo-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/libjpeg-turbo-build"
            cp -L "$jpeg_prefix/lib/libjpeg.so.8" \
              retrodeck-tools/aarch64/libjpeg.so.8
            cp "$jpeg_source/LICENSE.md" \
              retrodeck-tools/aarch64/libjpeg-turbo-LICENSE.md
            readelf -h retrodeck-tools/aarch64/libjpeg.so.8 |
              grep -F 'Machine:' | grep -F 'AArch64'
            readelf -d retrodeck-tools/aarch64/libjpeg.so.8 |
              grep -F 'SONAME' | grep -F 'libjpeg.so.8'
          fi
          chmod 755 "retrodeck-tools/${{ matrix.arch }}/unsquashfs"
          chmod 755 "retrodeck-tools/${{ matrix.arch }}/liblzo2.so.2"
          for binary in "retrodeck-tools/${{ matrix.arch }}"/*; do
            [[ "$binary" == *-copyright ]] && continue
            readelf -h "$binary" | grep -F "Machine:" | grep -F "${{ matrix.elf_machine }}"
          done
          if readelf -d "retrodeck-tools/${{ matrix.arch }}/unsquashfs" | grep -q NEEDED; then
            echo "unsquashfs is not statically linked" >&2
            exit 1
          fi
          if readelf -l "retrodeck-tools/${{ matrix.arch }}/unsquashfs" | grep -q INTERP; then
            echo "unsquashfs still requires a dynamic loader" >&2
            exit 1
          fi
          help_output="$("retrodeck-tools/${{ matrix.arch }}/unsquashfs" -help 2>&1 || true)"
          grep -qi lzo <<< "$help_output"

      - uses: actions/upload-artifact@v4
        with:
          name: retrodeck-tools-${{ matrix.arch }}
          path: retrodeck-tools/${{ matrix.arch }}/
          if-no-files-found: error

  build:
    needs: build-retrodeck-tools
    runs-on: ubuntu-latest

    steps:
      - name: Clean out files part 1
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - name: Download RetroDECK tools
        uses: actions/download-artifact@v4
        with:
          pattern: retrodeck-tools-*
          path: retrodeck-tools
          merge-multiple: false

      - name: Install architecture-specific tools
        run: |
          for arch in x86_64 aarch64; do
            mkdir -p "PortMaster/retrodeck/$arch"
            cp -a "retrodeck-tools/retrodeck-tools-$arch/." "PortMaster/retrodeck/$arch/"
            chmod 755 "PortMaster/retrodeck/$arch/unsquashfs" "PortMaster/retrodeck/$arch/liblzo2.so.2"
          done

      - name: Clean out files part 2
        run: |
          rm -rf .git
          echo "Free Space"
          df -h

      - name: env - better defaulting of env vars;
        id: env
        run: |
            RELEASE_REPO="${{ secrets.RELEASE_REPO }}"
            if [[ -z "$RELEASE_REPO" ]]; then
              RELEASE_REPO="PortMaster-GUI"
            fi
            echo "RELEASE_REPO=$RELEASE_REPO" >> $GITHUB_OUTPUT

            RELEASE_ORG="${{ secrets.RELEASE_ORG }}"
            if [[ -z "$RELEASE_ORG" ]]; then
              RELEASE_ORG="PortsMaster"
            fi
            echo "RELEASE_ORG=$RELEASE_ORG" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - uses: edgarrc/action-7z@v1

      # The current version.json, do_release.sh updates this channel's entry in it.
      - uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "*.json"

      # Only stable builds installers, the others carry the latest ones along.
      - uses: robinraju/release-downloader@v1.8
        if: ${{ inputs.channel != 'stable' }}
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "Install*PortMaster.sh"
          out-file-path: dist

      - name: Get release name for artifacts
        id: version
        run: |
            echo "version=$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
            echo "release=${{ inputs.channel }}" >> $GITHUB_OUTPUT

      - name: Create PortMaster.zip
        id: create-zip
        run: |
          ./do_release.sh "${{steps.version.outputs.release}}" "${{steps.version.outputs.version}}"

          # The CFW bundles are what CFWs put in their images: always made from stable.
          if [[ "${{steps.version.outputs.release}}" == "stable" ]]; then
            BUNDLE_FROM=""
          else
            BUNDLE_FROM="stable"
          fi

          ./do_muos_release.sh $BUNDLE_FROM
          ./do_trimui_release.sh $BUNDLE_FROM
          ./do_retrodeck_release.sh $BUNDLE_FROM

      - name: Create md5 hashes
        id: md5
        run: |
            cd dist
            for file in *.zip; do
              if [ ! -f "$file" ]; then
                continue
              fi
              echo "file: $file"
              md5sum "$file" | cut -f1 -d' ' > "$file.md5"
            done

      - name: "Prepare Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{steps.version.outputs.version}}"
          allowUpdates: true
          draft: true
          prerelease: false
          replacesArtifacts: false
          omitNameDuringUpdate: true
          body: "Release: ${{steps.version.outputs.version}} (${{steps.version.outputs.release}})"
          artifacts: "dist/PortMaster.zip, dist/PortMaster.zip.md5, dist/version, dist/version.json, dist/Install*PortMaster.sh, dist/muos.portmaster.zip, dist/muos.portmaster.zip.md5, dist/retrodeck.portmaster.zip, dist/retrodeck.portmaster.zip.md5, dist/trimui.portmaster.zip, dist/trimui.portmaster.zip.md5"
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ steps.env.outputs.RELEASE_REPO }}
          owner: ${{ steps.env.outputs.RELEASE_ORG }}

      - name: "Publish Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{steps.version.outputs.version}}"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ steps.env.outputs.RELEASE_REPO}}
          owner: ${{ steps.env.outputs.RELEASE_ORG}}

      - name: Release Info
        id: info
        run: |
          echo "Published release: ${{steps.version.outputs.version}} (${{steps.version.outputs.release}}) to: https://github.com/${{ steps.env.outputs.RELEASE_ORG}}/${{ steps.env.outputs.RELEASE_REPO}}"
