[pytest]
testpaths = tests
addopts = -m "not network"
markers =
    sdl: needs the SDL2 libraries (pip install pysdl2-dll); runs headless with the dummy video driver
    network: talks to the internet, deselected by default (run with -m network)
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using SDL2 binaries:UserWarning
